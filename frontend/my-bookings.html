<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings | EventSphere</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen">

    <!-- NAVBAR -->
    <nav class="flex items-center justify-between px-10 py-4 bg-white shadow-md sticky top-0 z-50">
      <h1 class="text-2xl font-extrabold">🎟️ <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-500">EventSphere</span></h1>
      <div id="navLinks" class="flex gap-4 items-center">
        <!-- JS will populate this -->
      </div>
    </nav>

    <!-- HEADER -->
    <section class="bg-gradient-to-r from-purple-600 to-indigo-600 px-10 py-14 text-center text-white">
      <h2 class="text-4xl font-bold mb-3">My Bookings</h2>
      <p class="text-indigo-200 text-lg">Manage your event registrations and tickets</p>
    </section>

    <!-- BOOKINGS LIST -->
    <section class="px-10 py-12 max-w-5xl mx-auto">
      <div id="bookingsList" class="space-y-6">
        <!-- bookings yahan JS se load honge -->
      </div>

      <!-- NO BOOKINGS -->
      <div id="noBookings" class="text-center py-20 bg-white rounded-3xl shadow-sm hidden">
        <span class="text-6xl mb-4 block">🎫</span>
        <h3 class="text-2xl font-bold text-gray-800">No bookings found</h3>
        <p class="text-gray-400 mt-2 mb-8">You haven't booked any events yet.</p>
        <a href="/events.html" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-semibold transition">
          Browse Events
        </a>
      </div>

      <!-- LOADING -->
      <p id="loading" class="text-center text-indigo-500 text-lg">Loading your bookings...</p>
    </section>

    <!-- FOOTER -->
    <footer class="text-center py-6 text-gray-400 bg-white border-t mt-10">
      © 2026 EventSphere. All rights reserved.
    </footer>

    <script>
      const user = JSON.parse(localStorage.getItem("user"));

      window.onload = async () => {
        if (!user) {
          window.location.href = "/login.html";
          return;
        }
        updateNavbar();
        await fetchBookings();
      };

      function updateNavbar() {
        const navLinks = document.getElementById("navLinks");
        let html = `<a href="/index.html" class="text-gray-600 hover:text-indigo-600 font-medium">Home</a>`;
        
        if (user) {
          html += `<a href="/events.html" class="text-gray-600 hover:text-indigo-600 font-medium">Events</a>`;
          if (user.role === "admin") {
            html += `<a href="/admin-dashboard.html" class="text-gray-600 hover:text-indigo-600 font-medium">Dashboard</a>`;
          } else {
            html += `<a href="/my-bookings.html" class="text-indigo-600 font-semibold">My Bookings</a>`;
          }
          html += `<button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-1.5 rounded-lg text-white font-medium ml-2">Logout</button>`;
        }
        navLinks.innerHTML = html;
      }

      async function fetchBookings() {
        try {
          const response = await fetch(`http://localhost:5000/api/bookings/mybookings/${user.id || user._id}`);
          const data = await response.json();

          document.getElementById("loading").classList.add("hidden");

          if (!response.ok || data.bookings.length === 0) {
            document.getElementById("noBookings").classList.remove("hidden");
            return;
          }

          renderBookings(data.bookings);

        } catch (error) {
          document.getElementById("loading").textContent = "Failed to load bookings.";
        }
      }

      function renderBookings(bookings) {
        const list = document.getElementById("bookingsList");
        list.innerHTML = "";

        bookings.forEach((booking) => {
          const event = booking.eventId;
          const statusColors = {
            confirmed: "bg-green-100 text-green-600",
            cancelled: "bg-red-100 text-red-600",
          };

          const card = `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col md:flex-row">
              <div class="md:w-48 h-48 md:h-auto overflow-hidden bg-gray-200 shrink-0">
                <img src="${event ? event.image || 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=400&auto=format&fit=crop&q=60' : 'https://placehold.co/400x400/eeeeee/cccccc?text=Deleted'}" class="w-full h-full object-cover" alt="Event Image">
              </div>
              <div class="p-8 flex-grow">
                <div class="flex flex-wrap justify-between items-start gap-4 mb-4">
                  <div>
                    <span class="text-xs font-bold uppercase tracking-wider text-gray-400">Event</span>
                    <h3 class="text-xl font-bold text-gray-900">${event ? event.title : 'Deleted Event'}</h3>
                  </div>
                  <span class="${statusColors[booking.status] || 'bg-gray-100 text-gray-600'} text-xs font-bold px-3 py-1 rounded-full uppercase">
                    ${booking.status}
                  </span>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-sm">
                  <div>
                    <p class="text-gray-400 mb-1">Date</p>
                    <p class="text-gray-800 font-semibold">${event ? event.date : 'N/A'}</p>
                  </div>
                  <div>
                    <p class="text-gray-400 mb-1">Location</p>
                    <p class="text-gray-800 font-semibold">${event ? event.location : 'N/A'}</p>
                  </div>
                  <div>
                    <p class="text-gray-400 mb-1">Tickets</p>
                    <p class="text-gray-800 font-semibold">${booking.ticketsBooked}</p>
                  </div>
                  <div>
                    <p class="text-gray-400 mb-1">Total Paid</p>
                    <p class="text-indigo-600 font-bold">₹${booking.totalPrice}</p>
                  </div>
                </div>
              </div>
              
              <div class="bg-gray-50 p-8 flex items-center justify-center border-l border-gray-100">
                ${booking.status === 'confirmed' ? `
                  <button 
                    onclick="cancelBooking('${booking._id}')"
                    class="text-red-500 hover:text-red-700 font-semibold text-sm transition"
                  >
                    Cancel Booking
                  </button>
                ` : `
                  <span class="text-gray-400 text-sm italic">No actions</span>
                `}
              </div>
            </div>
          `;
          list.innerHTML += card;
        });
      }

      async function cancelBooking(id) {
        if (!confirm("Are you sure you want to cancel this booking?")) return;

        try {
          const response = await fetch(`http://localhost:5000/api/bookings/cancel/${id}`, {
            method: "PUT",
          });

          if (response.ok) {
            alert("Booking cancelled successfully!");
            location.reload();
          } else {
            const data = await response.json();
            alert("Error: " + data.message);
          }
        } catch (error) {
          alert("Failed to cancel booking.");
        }
      }

      function logout() {
        localStorage.removeItem("user");
        window.location.href = "/login.html";
      }
    </script>
  </body>
</html>
