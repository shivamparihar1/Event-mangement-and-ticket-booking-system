<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | EventSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-deep: #080808;
      --phosphor-blue: #2e7eff;
      --phosphor-glow: rgba(46, 126, 255, 0.15);
      --phosphor-hot: #80b4ff;
      --surface-edge: #1a1a1a;
      --text-dim: #555;
      --text-muted: #888;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg-deep);
      color: var(--phosphor-hot);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
    }



    /* ── PHOSPHOR GLOW BLOB ── */
    .diffusion-core {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--phosphor-glow) 0%, transparent 70%);
      filter: blur(80px);
      animation: blobPulse 8s infinite alternate ease-in-out;
      z-index: 1;
      pointer-events: none;
      transition: left 2s cubic-bezier(0.16, 1, 0.3, 1), top 2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes blobPulse {
      0%   { transform: scale(1);    opacity: 0.5; }
      100% { transform: scale(1.2);  opacity: 0.8; }
    }

    /* ── GRAIN NOISE ── */
    .grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    }

    /* ── NAV ── */
    .login-navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 20px 40px;
      background: linear-gradient(to bottom, rgba(8,8,8,0.95), rgba(8,8,8,0.4));
      backdrop-filter: blur(10px);
      animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(-20px);
    }

    @keyframes slideDown {
      to { opacity: 1; transform: translateY(0); }
    }

    .back-button {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1px solid var(--surface-edge);
      color: var(--phosphor-blue);
      padding: 10px 20px;
      border-radius: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .back-button:hover {
      border-color: var(--phosphor-blue);
      box-shadow: 0 0 15px var(--phosphor-glow);
      transform: translateX(-5px);
      background: rgba(46, 126, 255, 0.05);
    }

    /* ── MAIN LAYOUT ── */
    .login-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: fadeIn 0.8s cubic-bezier(0.33, 1, 0.68, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .login-main {
      position: relative;
      width: 100%;
      max-width: 480px;
      padding: 40px;
    }

    /* ── HEADER ── */
    .login-header {
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(20px);
      animation: reveal 1s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-subtitle {
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .login-h1 {
      font-size: 3.5rem;
      letter-spacing: -0.04em;
      line-height: 0.9;
      color: var(--phosphor-hot);
      text-shadow: 0 0 20px var(--phosphor-glow);
      font-weight: 900;
    }

    .login-h1 .accent {
      color: var(--phosphor-blue);
    }

    /* ── TABS ── */
    .tab-row {
      display: flex;
      gap: 0;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--surface-edge);
      opacity: 0;
      animation: reveal 1s 0.1s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 12px 0;
      margin-right: 32px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      position: relative;
      transition: color 0.3s ease;
    }

    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--phosphor-blue);
      box-shadow: 0 0 8px var(--phosphor-blue);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-btn.active {
      color: var(--phosphor-hot);
    }

    .tab-btn.active::after {
      width: 100%;
    }

    /* ── PANELS ── */
    .tab-panel {
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .tab-panel.active {
      display: flex;
      flex-direction: column;
      gap: 36px;
      opacity: 1;
      transform: translateY(0);
      animation: reveal 0.4s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── FORM INPUTS ── */
    .input-group {
      position: relative;
      border-bottom: 1px solid var(--surface-edge);
      transition: border-color 0.4s ease;
    }

    .input-group:focus-within {
      border-color: var(--phosphor-blue);
    }

    .input-group label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      background: transparent;
      border: none;
      padding: 10px 0;
      color: var(--phosphor-hot);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      outline: none;
    }

    .input-group select option {
      background: #111;
      color: var(--phosphor-hot);
    }

    .input-group input::placeholder {
      color: rgba(46, 126, 255, 0.25);
    }

    .input-glow {
      position: absolute;
      bottom: -1px;
      left: 0;
      height: 1px;
      width: 0;
      background: var(--phosphor-blue);
      box-shadow: 0 0 15px var(--phosphor-blue);
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .input-group input:focus ~ .input-glow,
    .input-group select:focus ~ .input-glow {
      width: 100%;
    }

    /* ── ROLE RADIO ── */
    .role-row {
      display: flex;
      gap: 12px;
    }

    .role-option {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--surface-edge);
      padding: 12px 16px;
      border-radius: 4px;
      cursor: crosshair;
      transition: all 0.3s ease;
    }

    .role-option:hover {
      border-color: rgba(46, 126, 255, 0.4);
    }

    .role-option input[type="radio"] {
      accent-color: var(--phosphor-blue);
      width: 14px;
      height: 14px;
    }

    .role-option span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .role-option:has(input:checked) {
      border-color: var(--phosphor-blue);
      background: rgba(46, 126, 255, 0.05);
      box-shadow: 0 0 12px var(--phosphor-glow);
    }

    .role-option:has(input:checked) span {
      color: var(--phosphor-hot);
    }

    /* ── ACTION ROW ── */
    .action-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .link-muted {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-dim);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.3s ease;
    }

    .link-muted:hover {
      color: var(--phosphor-blue);
    }

    /* ── PRIMARY BUTTON ── */
    .primary-btn {
      background: var(--phosphor-blue);
      color: var(--bg-deep);
      border: none;
      padding: 14px 32px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .primary-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.1);
      transform: translateX(-100%);
      transition: transform 0.4s ease;
    }

    .primary-btn:hover:not(:disabled)::before {
      transform: translateX(0);
    }

    .primary-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px var(--phosphor-glow);
      background: var(--phosphor-hot);
    }

    .primary-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .primary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── WIDE BUTTON ── */
    .primary-btn.full {
      width: 100%;
    }

    /* ── MESSAGE ── */
    .msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      padding: 10px 0;
      display: none;
    }

    .msg.error {
      color: #ff6b6b;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
    }

    .msg.success {
      color: #6bffb8;
      text-shadow: 0 0 10px rgba(107, 255, 184, 0.3);
    }

    .msg.show {
      display: block;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--surface-edge);
    }
    .divider-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ── GOOGLE BUTTON ── */
    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #fff;
      border: none;
      padding: 13px 24px;
      border-radius: 3px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1f1f1f;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .google-btn:hover:not(:disabled) {
      background: #f5f5f5;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .google-btn:active:not(:disabled) { transform: translateY(0); }
    .google-btn:disabled { opacity: 0.5; }
    .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── SCROLLABLE ON SMALL SCREENS ── */
    @media (max-height: 760px) {
      body { overflow: auto; }
      .login-container { position: relative; min-height: 100vh; padding: 100px 0 40px; }
    }
  </style>
</head>
<body>

  <!-- Effects -->
  <div class="grain-overlay"></div>
  <div class="diffusion-core" id="diffusionCore"></div>

  <!-- Navbar -->
  <nav class="login-navbar">
    <a href="/index.html" class="back-button">
      ← Back to Home
    </a>
  </nav>

  <!-- Main -->
  <div class="login-container">
    <main class="login-main">

      <!-- Header -->
      <header class="login-header">
        <div class="login-subtitle">Secure Access Layer</div>
        <h1 class="login-h1">Event<span class="accent">Sphere</span></h1>
      </header>

      <!-- Tabs -->
      <div class="tab-row">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- ── LOGIN PANEL ── -->
      <div class="tab-panel active" id="panel-login">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="operator@example.com" />
          <div class="input-glow"></div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" />
          <div class="input-glow"></div>
        </div>

        <div class="msg error" id="loginError"></div>
        <div class="msg success" id="loginSuccess"></div>

        <div class="action-area">
          <span class="link-muted" style="opacity:0.4;">Recover_Access</span>
          <button class="primary-btn" id="loginBtn" onclick="doLogin()">Initialize</button>
        </div>

        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">Or</span>
          <div class="divider-line"></div>
        </div>

        <button class="google-btn" id="googleBtn" onclick="doGoogleLogin()">
          <svg viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- ── REGISTER PANEL ── -->
      <div class="tab-panel" id="panel-register">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Your full name" />
          <div class="input-glow"></div>
        </div>

        <div class="input-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="operator@example.com" />
          <div class="input-glow"></div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Min. 6 characters" />
          <div class="input-glow"></div>
        </div>

        <div class="input-group">
          <label>Register As</label>
          <div class="role-row" style="margin-top: 8px;">
            <label class="role-option">
              <input type="radio" name="role" value="user" checked />
              <span>👤 User</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="admin" />
              <span>🛠 Admin</span>
            </label>
          </div>
        </div>

        <div class="msg error" id="regError"></div>
        <div class="msg success" id="regSuccess"></div>

        <div class="action-area">
          <span class="link-muted" onclick="switchTab('login')" style="cursor:crosshair;">
            Already have an account?
          </span>
          <button class="primary-btn" id="regBtn" onclick="doRegister()">Create Account</button>
        </div>
      </div>

    </main>
  </div>

  <script>
    /* ── DIFFUSION CORE MOUSE TRACKING ── */
    const core = document.getElementById('diffusionCore');
    document.addEventListener('mousemove', (e) => {
      core.style.left = (e.clientX - 300) + 'px';
      core.style.top  = (e.clientY - 300) + 'px';
    });

    /* ── AUTO TAB FROM REDIRECT ── */
    const openTab = localStorage.getItem('openTab');
    if (openTab) {
      localStorage.removeItem('openTab');
      switchTab(openTab);
    }

    /* ── TAB SWITCHING ── */
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }

    /* ── HELPERS ── */
    function showMsg(elId, text, type) {
      const el = document.getElementById(elId);
      el.textContent = text;
      el.className = 'msg ' + type + ' show';
    }

    function hideMsg(elId) {
      document.getElementById(elId).className = 'msg';
    }

    /* ── LOGIN ── */
    async function doLogin() {
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const btn      = document.getElementById('loginBtn');

      hideMsg('loginError');
      hideMsg('loginSuccess');

      if (!email || !password) {
        showMsg('loginError', '// All fields required', 'error');
        return;
      }

      btn.textContent = 'Initializing...';
      btn.disabled = true;

      try {
        const res  = await fetch('http://localhost:5001/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg('loginError', '// ' + data.message, 'error');
          btn.textContent = 'Initialize';
          btn.disabled = false;
          return;
        }

        localStorage.setItem('user', JSON.stringify(data.user));
        showMsg('loginSuccess', '// Auth successful — redirecting...', 'success');

        setTimeout(() => {
          window.location.href = data.user.role === 'admin'
            ? '/admin-dashboard.html'
            : '/events.html';
        }, 1200);

      } catch (err) {
        showMsg('loginError', '// Server unreachable. Retry.', 'error');
        btn.textContent = 'Initialize';
        btn.disabled = false;
      }
    }

    /* ── REGISTER ── */
    async function doRegister() {
      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role     = document.querySelector('input[name="role"]:checked').value;
      const btn      = document.getElementById('regBtn');

      hideMsg('regError');
      hideMsg('regSuccess');

      if (!name || !email || !password) {
        showMsg('regError', '// All fields required', 'error');
        return;
      }

      if (password.length < 6) {
        showMsg('regError', '// Password must be at least 6 characters', 'error');
        return;
      }

      btn.textContent = 'Creating...';
      btn.disabled = true;

      try {
        const res  = await fetch('http://localhost:5001/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role }),
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg('regError', '// ' + data.message, 'error');
          btn.textContent = 'Create Account';
          btn.disabled = false;
          return;
        }

        showMsg('regSuccess', '// Account created — switching to login...', 'success');

        setTimeout(() => {
          switchTab('login');
          showMsg('loginSuccess', '// Account ready. Please login.', 'success');
          btn.textContent = 'Create Account';
          btn.disabled = false;
        }, 1500);

      } catch (err) {
        showMsg('regError', '// Server unreachable. Retry.', 'error');
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    }

    /* ── GOOGLE LOGIN ── */
    const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID'; // Replace with your actual Client ID

    function doGoogleLogin() {
      const btn = document.getElementById('googleBtn');

      if (!window.google) {
        showMsg('loginError', '// Google Sign-In not loaded. Check your internet.', 'error');
        return;
      }

      btn.textContent = 'Connecting...';
      btn.disabled = true;

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: async (response) => {
          try {
            // Decode JWT payload (no verification needed client-side)
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            const { sub: googleId, name, email, picture: avatar } = payload;

            const res  = await fetch('http://localhost:5001/api/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ googleId, name, email, avatar }),
            });
            const data = await res.json();

            if (!res.ok) {
              showMsg('loginError', '// ' + data.message, 'error');
              btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Continue with Google`;
              btn.disabled = false;
              return;
            }

            localStorage.setItem('user', JSON.stringify(data.user));
            showMsg('loginSuccess', '// Google auth successful — redirecting...', 'success');
            setTimeout(() => {
              window.location.href = data.user.role === 'admin' ? '/admin-dashboard.html' : '/events.html';
            }, 1000);

          } catch (err) {
            showMsg('loginError', '// Google auth failed. Try again.', 'error');
            btn.textContent = 'Continue with Google';
            btn.disabled = false;
          }
        },
        auto_select: false,
        cancel_on_tap_outside: true,
      });

      google.accounts.id.prompt((notification) => {
        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
          // Fallback: render One Tap popup manually
          google.accounts.id.renderButton(
            document.createElement('div'),
            { theme: 'outline', size: 'large' }
          );
          // Trigger the prompt again on user gesture
          btn.textContent = 'Continue with Google';
          btn.disabled = false;
          showMsg('loginError', '// Pop-up blocked. Allow pop-ups and retry.', 'error');
        }
      });
    }
    
    /* ── ENTER KEY SUPPORT ── */
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const loginActive = document.getElementById('panel-login').classList.contains('active');
      if (loginActive) doLogin();
      else doRegister();
    });
  </script>

</body>
</html>
