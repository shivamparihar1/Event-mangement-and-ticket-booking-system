<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | EventSphere</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100">

    <div class="w-full max-w-md mx-4">

      <!-- CARD -->
      <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- TOP BANNER -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-8 py-8 text-center">
          <h1 class="text-3xl font-extrabold">🎟️ <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-pink-200">EventSphere</span></h1>
          <p class="text-indigo-200 mt-2 text-sm">Welcome back! We missed you</p>
        </div>

        <!-- FORM -->
        <div class="px-8 py-8">
          <h2 class="text-2xl font-bold text-gray-800 mb-1">Login</h2>
          <p class="text-gray-400 text-sm mb-6">Enter your credentials to continue</p>

          <form id="loginForm" class="space-y-5">

            <!-- EMAIL -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Email Address</label>
              <div class="flex items-center border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-indigo-500 transition">
                <span class="text-gray-400 mr-3">📧</span>
                <input
                  type="email"
                  id="email"
                  placeholder="Enter your email"
                  class="w-full text-gray-800 text-sm outline-none bg-transparent"
                />
              </div>
            </div>

            <!-- PASSWORD -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Password</label>
              <div class="flex items-center border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-indigo-500 transition">
                <span class="text-gray-400 mr-3">🔒</span>
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  class="w-full text-gray-800 text-sm outline-none bg-transparent"
                />
              </div>
            </div>

            <!-- ERROR -->
            <p id="errorMsg" class="text-red-500 text-sm bg-red-50 px-4 py-2 rounded-lg hidden"></p>

            <!-- SUCCESS -->
            <p id="successMsg" class="text-green-600 text-sm bg-green-50 px-4 py-2 rounded-lg hidden"></p>

            <!-- BUTTON -->
            <button
              type="submit"
              id="submitBtn"
              class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 text-sm"
            >
              Login →
            </button>

          </form>

          <!-- REGISTER LINK -->
          <p class="text-center text-gray-400 text-sm mt-6">
            Don't have an account?
            <a href="/register.html" class="text-indigo-600 font-semibold hover:underline">Register here</a>
          </p>

        </div>
      </div>

    </div>

    <script>
      const form = document.getElementById("loginForm");
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        errorMsg.classList.add("hidden");
        successMsg.classList.add("hidden");

        if (!email || !password) {
          errorMsg.textContent = "Please fill in all fields.";
          errorMsg.classList.remove("hidden");
          return;
        }

        submitBtn.textContent = "Logging in...";
        submitBtn.disabled = true;

        try {
          const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            errorMsg.textContent = data.message;
            errorMsg.classList.remove("hidden");
            submitBtn.textContent = "Login →";
            submitBtn.disabled = false;
            return;
          }

          // user ka data localStorage mein save karo
          localStorage.setItem("user", JSON.stringify(data.user));

          successMsg.textContent = "Login successful! Redirecting...";
          successMsg.classList.remove("hidden");

          // role check karke redirect karo
          setTimeout(() => {
            if (data.user.role === "admin") {
              window.location.href = "/admin-dashboard.html";
            } else {
              window.location.href = "/events.html";
            }
          }, 1500);

        } catch (error) {
          errorMsg.textContent = "Server not reachable. Please try again.";
          errorMsg.classList.remove("hidden");
          submitBtn.textContent = "Login →";
          submitBtn.disabled = false;
        }
      });
    </script>

  </body>
</html>
