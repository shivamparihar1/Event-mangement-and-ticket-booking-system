<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events | EventSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --onyx-deep: #050505;
        --mercury: #e0e0e0;
        --phosphor-blue: #00f2ff;
        --viscous-ease: cubic-bezier(0.23, 1, 0.32, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background-color: var(--onyx-deep); color: var(--mercury); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

      /* ── FLUID BACKGROUND ── */
      .liquid-bg { position: fixed; inset: 0; z-index: -1; filter: blur(80px); opacity: 0.6; pointer-events: none; overflow: hidden; }
      .blob { position: absolute; border-radius: 50%; animation: drift 20s infinite alternate var(--viscous-ease); }
      @keyframes drift { from { transform: translate(-10%, -10%) scale(1); } to { transform: translate(20%, 20%) scale(1.2); } }

      /* ── NAVBAR ── */
      .events-nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(to bottom, rgba(5,5,5,0.95), transparent); backdrop-filter: blur(4px); }
      .nav-logo { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1.2rem; color: #fff; text-decoration: none; letter-spacing: 2px; }
      .nav-links { display: flex; gap: 30px; align-items: center; }
      .nav-link { color: var(--mercury); text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s ease; }
      .nav-link:hover { color: var(--phosphor-blue); }
      .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: var(--mercury); padding: 8px 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; }
      .logout-btn:hover { border-color: #ff4444; color: #ff4444; }

      /* ── MAIN CONTAINER ── */
      .events-container { max-width: 1400px; margin: 0 auto; padding: 120px 60px 80px 60px; position: relative; z-index: 5; }
      .events-h1 { font-size: clamp(3rem, 8vw, 6rem); font-weight: 800; line-height: 0.9; margin-bottom: 40px; letter-spacing: -4px; background: linear-gradient(180deg, #fff 0%, #333 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: slideIn 1s var(--viscous-ease) forwards; }
      @keyframes slideIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

      /* ── SEARCH & FILTER ── */
      .controls-bar { display: flex; flex-direction: column; gap: 20px; margin-bottom: 60px; }
      .search-box { display: flex; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 4px; max-width: 400px; }
      .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; margin-left: 10px; }
      .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .filter-label { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: #555; margin-right: 6px; }
      .filter-pill { background: transparent; border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.35); padding: 7px 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; border-radius: 2px; transition: all 0.25s ease; }
      .filter-pill:hover { border-color: rgba(0,242,255,0.35); color: rgba(255,255,255,0.7); }
      .filter-pill.active { border-color: var(--phosphor-blue); color: var(--phosphor-blue); background: rgba(0,242,255,0.07); box-shadow: 0 0 12px rgba(0,242,255,0.12); }

      /* ── GRID (3 columns) ── */
      .event-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 30px; animation: slideIn 1.2s 0.4s var(--viscous-ease) both; }

      /* ── EVENT CARD ── */
      .event-card { position: relative; cursor: pointer; transition: transform 0.5s var(--viscous-ease); }
      .event-card:nth-child(3n+2) { margin-top: 60px; }
      .image-wrapper { position: relative; width: 100%; aspect-ratio: 4/3; background: #111; overflow: hidden; border-radius: 3px; box-shadow: 0 20px 50px -15px rgba(0,0,0,0.8); }
      .image-wrapper::after { content: 'VIEW DETAILS'; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 5px; opacity: 0; transition: all 0.4s ease; color: #fff; z-index: 10; }
      .event-card:hover .image-wrapper::after { opacity: 1; top: 45%; }
      .image-wrapper img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.55); transition: all 0.8s var(--viscous-ease); }
      .event-card:hover img { transform: scale(1.06); filter: grayscale(0) brightness(0.85); }
      .image-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%); z-index: 1; }

      /* Category badge on image */
      .cat-badge { position: absolute; top: 14px; left: 14px; z-index: 2; background: rgba(0,0,0,0.7); border: 1px solid rgba(0,242,255,0.3); color: var(--phosphor-blue); font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.12em; padding: 4px 10px; border-radius: 2px; backdrop-filter: blur(4px); }
      .price-badge { position: absolute; bottom: 14px; right: 14px; z-index: 2; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 700; color: #fff; }

      .card-info { margin-top: 18px; }
      .card-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
      .card-meta span { color: #888; }
      .card-title { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.5px; margin-bottom: 8px; color: #fff; }
      .card-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: #444; text-transform: uppercase; display: flex; gap: 16px; }
      .card-sub span { color: #777; }

      /* Seats indicator */
      .seats-bar { margin-top: 12px; height: 2px; background: rgba(255,255,255,0.05); border-radius: 1px; overflow: hidden; }
      .seats-fill { height: 100%; background: var(--phosphor-blue); border-radius: 1px; transition: width 1s ease; }

      .book-btn { display: inline-block; margin-top: 14px; background: transparent; border: 1px solid rgba(0,242,255,0.2); color: rgba(255,255,255,0.6); padding: 10px 22px; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; position: relative; overflow: hidden; transition: all 0.4s ease; cursor: pointer; text-decoration: none; }
      .book-btn::before { content: ''; position: absolute; top: 100%; left: 0; width: 100%; height: 100%; background: var(--phosphor-blue); transition: transform 0.5s cubic-bezier(0.22,1,0.36,1); z-index: -1; }
      .book-btn:hover { color: #000; border-color: var(--phosphor-blue); }
      .book-btn:hover::before { transform: translateY(-100%); }

      .hidden { display: none !important; }

      @media (max-width: 1100px) { .event-grid { grid-template-columns: repeat(2, 1fr); } .event-card:nth-child(3n+2) { margin-top: 0; } .event-card:nth-child(even) { margin-top: 60px; } }
      @media (max-width: 680px) { .event-grid { grid-template-columns: 1fr; } .event-card:nth-child(even) { margin-top: 0; } .events-container { padding: 100px 20px 60px; } }
    </style>
  </head>
  <body>
    <div class="liquid-bg">
      <div id="blob1" class="blob" style="width:600px;height:600px;top:-100px;right:-100px;background:linear-gradient(45deg,#111,#001f3f);"></div>
      <div id="blob2" class="blob" style="width:500px;height:500px;bottom:-50px;left:-100px;background:linear-gradient(45deg,#0a0a0a,#151515);"></div>
    </div>

    <nav class="events-nav">
      <a href="/index.html" class="nav-logo">EVENT<span style="color:var(--phosphor-blue)">SPHERE</span></a>
      <div class="nav-links">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/events.html" class="nav-link" style="color:var(--phosphor-blue)">Events</a>
        <a href="/my-bookings.html" class="nav-link">Bookings</a>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <main class="events-container">
      <h1 class="events-h1">Discover<br />Experiences</h1>

      <div class="controls-bar">
        <div class="search-box">
          <span style="opacity:0.5;font-family:'JetBrains Mono',monospace;font-size:0.8rem">{ }</span>
          <input type="text" id="searchInput" placeholder="Search experiences..." />
        </div>
        <div class="filter-row" id="filterContainer">
          <span class="filter-label">Category //</span>
        </div>
      </div>

      <div id="eventsGrid" class="event-grid"></div>
      <p id="noEvents" class="hidden" style="text-align:center;font-family:'JetBrains Mono',monospace;margin-top:40px;color:#555;">// NO EVENTS MATCHING CRITERIA</p>
      <p id="loading" style="text-align:center;font-family:'JetBrains Mono',monospace;margin-top:40px;color:#00f2ff;">INITIALIZING ACTIVE EXPERIENCES...</p>
    </main>

    <script>
      // ── AUTH GUARD ──
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) { window.location.href = '/login.html'; }

      // ── STATIC FALLBACK EVENTS (shown when backend is unreachable) ──
      const STATIC_EVENTS = [
        { _id:'s1', title:'Neon Nights Music Festival', category:'Music', date:'2026-10-24', location:'Mumbai', price:1999, totalSeats:5000, availableSeats:3200, description:'Electrifying night of live music with top artists and jaw-dropping light shows.' },
        { _id:'s2', title:'Future AI Summit \'26', category:'Technical', date:'2026-11-12', location:'Bangalore', price:4500, totalSeats:2500, availableSeats:900, description:'Industry pioneers and live demos from top AI companies.' },
        { _id:'s3', title:'Valorant Pro League Finals', category:'Sports', date:'2026-12-01', location:'Delhi', price:999, totalSeats:10000, availableSeats:7500, description:'Top 8 teams battle for the championship and ₹50L prize pool.' },
        { _id:'s4', title:'Startup Pitch Battle', category:'Technical', date:'2026-11-28', location:'Hyderabad', price:699, totalSeats:800, availableSeats:400, description:'50 curated startups compete for seed funding before 5 VC judges.' },
        { _id:'s5', title:'Classical Ragas Under the Stars', category:'Cultural', date:'2026-10-10', location:'Jaipur', price:1200, totalSeats:1500, availableSeats:600, description:'Enchanting Indian classical music in an open-air amphitheatre.' },
        { _id:'s6', title:'Mumbai Marathon 2026', category:'Sports', date:'2027-01-15', location:'Mumbai', price:1500, totalSeats:15000, availableSeats:9800, description:'India\'s most iconic 42km marathon through the heart of Mumbai.' },
        { _id:'s7', title:'Desert Vibes Open Air', category:'Music', date:'2027-02-20', location:'Jaisalmer', price:5500, totalSeats:2000, availableSeats:750, description:'3-day open-air festival in the Thar desert with art installations.' },
        { _id:'s8', title:'Diwali Cultural Extravaganza', category:'Cultural', date:'2026-10-29', location:'Ahmedabad', price:799, totalSeats:4000, availableSeats:2800, description:'Classical dance, folk music, and a stunning fireworks display.' },
        { _id:'s9', title:'Comedy Chaos Live', category:'Entertainment', date:'2026-11-22', location:'Bangalore', price:1499, totalSeats:1200, availableSeats:450, description:'India\'s top 10 stand-up comedians for 3 hours of non-stop laughter.' },
        { _id:'s10', title:'Fashion Week India \'26', category:'Cultural', date:'2026-10-18', location:'Mumbai', price:8000, totalSeats:600, availableSeats:200, description:'40 designers, 3 runway shows per day, and exclusive after-party gala.' },
        { _id:'s11', title:'BlockChain India Conference', category:'Technical', date:'2026-12-10', location:'Pune', price:3200, totalSeats:1800, availableSeats:1100, description:'Deep-dive sessions on Web3, DeFi, NFTs, and the decentralized future.' },
        { _id:'s12', title:'Indie Film Festival', category:'Entertainment', date:'2026-12-15', location:'Kolkata', price:600, totalSeats:1000, availableSeats:850, description:'72 hours of indie film screenings, director panels, and awards.' },
        { _id:'s13', title:'The Sufi Night', category:'Music', date:'2026-12-20', location:'Delhi', price:2200, totalSeats:800, availableSeats:320, description:'Intimate Sufi music and qawwali by masters from Rajasthan.' },
        { _id:'s14', title:'DevFest India 2026', category:'Technical', date:'2026-11-30', location:'Bangalore', price:0, totalSeats:3000, availableSeats:2100, description:'Google\'s flagship developer festival — Android, Flutter, AI/ML.' },
        { _id:'s15', title:'National Kabaddi Championship', category:'Sports', date:'2026-11-05', location:'Chennai', price:299, totalSeats:8000, availableSeats:6000, description:'Top 16 state teams in 4-day national kabaddi championship.' },
      ];

      // Category → image mapping
      const CAT_IMAGES = {
        'Music':         'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80',
        'Technical':     'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800&q=80',
        'Sports':        'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=800&q=80',
        'Cultural':      'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&q=80',
        'Entertainment': 'https://images.unsplash.com/photo-1505236858219-8359eb29e329?w=800&q=80',
      };

      // Per-event unique images for static events
      const EVENT_IMAGES = {
        's1': 'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=800&q=80',
        's2': 'https://images.unsplash.com/photo-1505373877841-8d25f7d46678?w=800&q=80',
        's3': 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800&q=80',
        's4': 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=800&q=80',
        's5': 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800&q=80',
        's6': 'https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?w=800&q=80',
        's7': 'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=800&q=80',
        's8': 'https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?w=800&q=80',
        's9': 'https://images.unsplash.com/photo-1527224857830-43a7acc85260?w=800&q=80',
        's10':'https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=800&q=80',
        's11':'https://images.unsplash.com/photo-1621570169862-b1bf4e33afd8?w=800&q=80',
        's12':'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=800&q=80',
        's13':'https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=800&q=80',
        's14':'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&q=80',
        's15':'https://images.unsplash.com/photo-1562088231-ef5b7af82d9a?w=800&q=80',
      };

      let allEvents = [];
      let currentFilter = 'All';

      // Blob parallax
      document.addEventListener('mousemove', (e) => {
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        const b1 = document.getElementById('blob1');
        const b2 = document.getElementById('blob2');
        if (b1) b1.style.transform = `translate(${x*30}px,${y*30}px)`;
        if (b2) b2.style.transform = `translate(${x*-20}px,${y*-20}px)`;
      });

      window.onload = async () => {
        try {
          const token = localStorage.getItem('token');
          const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
          const response = await fetch('http://localhost:5001/api/events/all', { headers });
          const data = await response.json();
          document.getElementById('loading').classList.add('hidden');

          if (!response.ok || !data.events || data.events.length === 0) {
            allEvents = STATIC_EVENTS;
          } else {
            allEvents = data.events;
          }
        } catch {
          document.getElementById('loading').classList.add('hidden');
          allEvents = STATIC_EVENTS;
        }
        renderFilters();
        renderEvents(allEvents);
      };

      function renderFilters() {
        const container = document.getElementById('filterContainer');
        const categories = ['All', ...new Set(allEvents.map(e => e.category))];
        categories.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = `filter-pill${cat === 'All' ? ' active' : ''}`;
          btn.textContent = cat;
          btn.onclick = () => {
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = cat;
            applyFilters();
          };
          container.appendChild(btn);
        });
      }

      function applyFilters() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allEvents.filter(e => {
          const matchCat = currentFilter === 'All' || e.category === currentFilter;
          const matchSearch = e.title.toLowerCase().includes(q) || e.location.toLowerCase().includes(q);
          return matchCat && matchSearch;
        });
        renderEvents(filtered);
      }

      document.getElementById('searchInput').addEventListener('input', applyFilters);

      function getImg(event) {
        if (EVENT_IMAGES[event._id]) return EVENT_IMAGES[event._id];
        return CAT_IMAGES[event.category] || 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&q=80';
      }

      function renderEvents(events) {
        const grid = document.getElementById('eventsGrid');
        const noEvents = document.getElementById('noEvents');
        grid.innerHTML = '';

        if (events.length === 0) { noEvents.classList.remove('hidden'); return; }
        noEvents.classList.add('hidden');

        events.forEach(event => {
          const imgUrl = getImg(event);
          const seatsPercent = event.totalSeats > 0 ? Math.round((event.availableSeats / event.totalSeats) * 100) : 0;
          const priceLabel = event.price === 0 ? 'FREE' : `₹${event.price.toLocaleString()}`;
          const detailHref = event._id.startsWith('s') ? '#' : `/event-detail.html?id=${event._id}`;

          grid.innerHTML += `
            <article class="event-card" onclick="window.location.href='${detailHref}'">
              <div class="image-wrapper">
                <span class="cat-badge">${event.category}</span>
                <span class="price-badge">${priceLabel}</span>
                <div class="image-overlay"></div>
                <img src="${imgUrl}" alt="${event.title}" loading="lazy" />
              </div>
              <div class="card-info">
                <div class="card-meta">DATE <span>${new Date(event.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span> &nbsp;•&nbsp; LOC <span>${event.location}</span></div>
                <div class="card-title">${event.title}</div>
                <div class="card-sub">SEATS <span>${event.availableSeats.toLocaleString()} left</span></div>
                <div class="seats-bar"><div class="seats-fill" style="width:${seatsPercent}%"></div></div>
                <a class="book-btn" href="${detailHref}">Book Tickets →</a>
              </div>
            </article>
          `;
        });
      }

      function logout() {
        localStorage.removeItem('user');
        localStorage.removeItem('token');
        window.location.href = '/login.html';
      }
    </script>
  </body>
</html>
