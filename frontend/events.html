<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events | EventSphere</title>
    <!-- Add Google Fonts Used in Car Rental -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --onyx-deep: #050505;
        --onyx-surface: #0a0a0a;
        --onyx-fluid: #121212;
        --mercury: #e0e0e0;
        --phosphor-blue: #00f2ff;
        --viscous-ease: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background-color: var(--onyx-deep);
        color: var(--mercury);
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ── FLUID BACKGROUND ── */
      .liquid-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        filter: blur(80px);
        opacity: 0.6;
        pointer-events: none;
        overflow: hidden;
      }

      .blob {
        position: absolute;
        background: linear-gradient(45deg, #1a1a1a, #000);
        border-radius: 50%;
        animation: drift 20s infinite alternate var(--viscous-ease);
      }

      @keyframes drift {
        from { transform: translate(-10%, -10%) scale(1); }
        to { transform: translate(20%, 20%) scale(1.2); }
      }

      /* ── NAVBAR (Dark) ── */
      .events-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 40px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: linear-gradient(to bottom, rgba(5,5,5,0.9), transparent);
        backdrop-filter: blur(4px);
      }
      .nav-logo {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 1.2rem;
        color: #fff;
        text-decoration: none;
        letter-spacing: 2px;
      }
      .nav-links {
        display: flex;
        gap: 30px;
      }
      .nav-link {
        color: var(--mercury);
        text-decoration: none;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: color 0.3s ease;
      }
      .nav-link:hover { color: var(--phosphor-blue); }

      .logout-btn {
        background: none;
        border: 1px solid rgba(255,255,255,0.2);
        color: var(--mercury);
        padding: 8px 16px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .logout-btn:hover {
        border-color: #ff4444;
        color: #ff4444;
      }

      /* ── MAIN CONTAINER ── */
      .events-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 120px 60px 80px 60px;
        position: relative;
        z-index: 5;
      }

      .events-h1 {
        font-size: clamp(3rem, 8vw, 6rem);
        font-weight: 800;
        line-height: 0.9;
        margin-bottom: 40px;
        letter-spacing: -4px;
        background: linear-gradient(180deg, #fff 0%, #333 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: slideIn 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ── SEARCH & FILTER BAR ── */
      .controls-bar {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 80px;
        animation: slideIn 1s 0.2s cubic-bezier(0.23, 1, 0.32, 1) forwards opacity-0;
      }

      .search-box {
        display: flex;
        align-items: center;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 12px 20px;
        border-radius: 4px;
        max-width: 400px;
      }
      .search-box input {
        background: transparent;
        border: none;
        color: #fff;
        width: 100%;
        outline: none;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        margin-left: 10px;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .filter-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #555;
        margin-right: 6px;
      }

      .filter-pill {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.35);
        padding: 7px 16px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.62rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        cursor: pointer;
        border-radius: 2px;
        transition: all 0.25s ease;
      }
      .filter-pill:hover {
        border-color: rgba(0,242,255,0.35);
        color: rgba(255,255,255,0.7);
      }
      .filter-pill.active {
        border-color: var(--phosphor-blue);
        color: var(--phosphor-blue);
        background: rgba(0,242,255,0.07);
        box-shadow: 0 0 12px rgba(0,242,255,0.12);
      }

      /* ── GRID ── */
      .event-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 60px 40px;
        opacity: 0;
        animation: slideIn 1.2s 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }

      .event-card {
        grid-column: span 6;
        position: relative;
        cursor: pointer;
        transition: transform 0.6s var(--viscous-ease);
      }

      .event-card:nth-child(even) { margin-top: 120px; }

      .image-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16/10;
        background: #111;
        overflow: hidden;
        border-radius: 2px;
        box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8);
      }

      .image-wrapper::after {
        content: 'VIEW DETAILS';
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        letter-spacing: 5px;
        opacity: 0;
        transition: all 0.4s ease;
        color: #fff;
        z-index: 10;
      }

      .event-card:hover .image-wrapper::after {
        opacity: 1;
        top: 45%;
      }

      .image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: grayscale(1) brightness(0.6);
        transition: all 0.8s var(--viscous-ease);
      }

      .event-card:hover img {
        transform: scale(1.05);
        filter: grayscale(0) brightness(0.9);
      }

      .card-info {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .card-title h3 {
        font-size: 1.5rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: -1px;
        margin: 10px 0;
      }

      .specs {
        display: flex;
        gap: 20px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        color: #666;
        text-transform: uppercase;
      }
      .specs span { color: var(--mercury); }

      .book-btn {
        background: transparent;
        border: 1px solid rgba(0,242,255,0.2);
        color: rgba(255,255,255,0.6);
        padding: 14px 28px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        position: relative;
        overflow: hidden;
        transition: all 0.4s ease;
        cursor: pointer;
        text-decoration: none;
      }

      .book-btn::before {
        content: '';
        position: absolute;
        top: 100%; left: 0; width: 100%; height: 100%;
        background: var(--phosphor-blue);
        transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
        z-index: -1;
      }

      .book-btn:hover {
        color: #000;
        border-color: var(--phosphor-blue);
      }
      .book-btn:hover::before { transform: translateY(-100%); }

      /* Utility */
      .opacity-0 { opacity: 0; }
      .hidden { display: none !important; }

      @media (max-width: 900px) {
        .event-card { grid-column: span 12; }
        .event-card:nth-child(even) { margin-top: 0; }
        .controls-bar { margin-bottom: 40px; }
      }
    </style>
  </head>
  <body>

    <!-- Fluid Background -->
    <div class="liquid-bg">
      <div id="blob1" class="blob" style="width: 600px; height: 600px; top: -100px; right: -100px; background: linear-gradient(45deg, #111, #001f3f);"></div>
      <div id="blob2" class="blob" style="width: 500px; height: 500px; bottom: -50px; left: -100px; background: linear-gradient(45deg, #0a0a0a, #151515);"></div>
    </div>

    <!-- Navigation -->
    <nav class="events-nav">
      <a href="/index.html" class="nav-logo">EVENT<span style="color:var(--phosphor-blue)">SPHERE</span></a>
      <div class="nav-links">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/events.html" class="nav-link" style="color:var(--phosphor-blue)">Events</a>
        <a href="/my-bookings.html" class="nav-link">Bookings</a>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <!-- Main Content -->
    <main class="events-container">
      <h1 class="events-h1">Discover<br />Experiences</h1>

      <div class="controls-bar">
        <div class="search-box">
          <span style="opacity: 0.5;">{ }</span>
          <input type="text" id="searchInput" placeholder="Search experiences..." />
        </div>

        <div class="filter-row" id="filterContainer">
          <span class="filter-label">Category //</span>
          <!-- Categories inject via JS -->
        </div>
      </div>

      <div id="eventsGrid" class="event-grid">
        <!-- Events injected via JS -->
      </div>

      <p id="noEvents" class="hidden" style="text-align:center; font-family:'JetBrains Mono', monospace; margin-top:40px; color:#555;">// NO EVENTS MATCHING CRITERIA</p>
      <p id="loading" style="text-align:center; font-family:'JetBrains Mono', monospace; margin-top:40px; color:#00f2ff;">INITIALIZING ACTIVE EXPERIENCES...</p>
    </main>

    <script>
      let allEvents = [];
      let currentFilter = 'All';

      // Mouse Parallax for Blobs
      document.addEventListener('mousemove', (e) => {
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        const b1 = document.getElementById('blob1');
        const b2 = document.getElementById('blob2');
        if(b1) b1.style.transform = `translate(${x * 30}px, ${y * 30}px)`;
        if(b2) b2.style.transform = `translate(${x * -20}px, ${y * -20}px)`;
      });

      // Load Events
      window.onload = async () => {
        try {
          const response = await fetch("http://localhost:5001/api/events/all");
          const data = await response.json();
          document.getElementById("loading").classList.add("hidden");

          if (!response.ok) {
            document.getElementById("noEvents").classList.remove("hidden");
            return;
          }

          allEvents = data.events;
          renderFilters();
          renderEvents(allEvents);
        } catch (error) {
          document.getElementById("loading").textContent = "SERVER CONNECTION FAILED";
        }
      };

      // Generate Filters Dynamically
      function renderFilters() {
        const container = document.getElementById("filterContainer");
        const categories = ["All", ...new Set(allEvents.map(e => e.category))];
        
        categories.forEach(cat => {
          const btn = document.createElement("button");
          btn.className = `filter-pill ${cat === 'All' ? 'active' : ''}`;
          btn.textContent = cat;
          btn.onclick = () => {
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = cat;
            applyFilters();
          };
          container.appendChild(btn);
        });
      }

      function applyFilters() {
        const query = document.getElementById("searchInput").value.toLowerCase();
        const filtered = allEvents.filter(e => {
          const matchesCat = currentFilter === 'All' || e.category === currentFilter;
          const matchesSearch = e.title.toLowerCase().includes(query) || e.location.toLowerCase().includes(query);
          return matchesCat && matchesSearch;
        });
        renderEvents(filtered);
      }

      document.getElementById("searchInput").addEventListener("input", applyFilters);

      // Render Grid
      function renderEvents(events) {
        const grid = document.getElementById("eventsGrid");
        const noEvents = document.getElementById("noEvents");
        grid.innerHTML = "";

        if (events.length === 0) {
          noEvents.classList.remove("hidden");
          return;
        }
        noEvents.classList.add("hidden");

        events.forEach(event => {
          // Fallback images based on category since backend has no image
          const defImages = {
            'Technical': 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800&q=80',
            'Cultural': 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80',
            'Sports': 'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=800&q=80'
          };
          const imgUrl = defImages[event.category] || 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&q=80';

          const card = `
            <article class="event-card" onclick="window.location.href='/event-detail.html?id=${event._id}'">
              <div class="image-wrapper">
                <img src="${imgUrl}" alt="${event.title}" />
              </div>
              <div class="card-info">
                <div class="card-title">
                  <div class="specs">
                    CAT <span>${event.category}</span> • DATE <span>${new Date(event.date).toLocaleDateString()}</span>
                  </div>
                  <h3>${event.title}</h3>
                  <div class="specs">
                    LOC <span>${event.location}</span> • PRICE <span>₹${event.price}</span>
                  </div>
                </div>
                <div class="book-btn">Details</div>
              </div>
            </article>
          `;
          grid.innerHTML += card;
        });
      }

      function logout() {
        localStorage.removeItem("user");
        window.location.href = "/login.html";
      }
    </script>
  </body>
</html>
