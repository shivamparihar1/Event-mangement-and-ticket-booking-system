<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | EventSphere</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen">

    <!-- NAVBAR -->
    <nav class="flex items-center justify-between px-10 py-4 bg-white shadow-md sticky top-0 z-50">
      <h1 class="text-2xl font-extrabold flex items-center">
        🎟️ <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-500 ml-1">EventSphere</span>
        <span class="text-xs bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded ml-3">Admin</span>
      </h1>
      <div id="navLinks" class="flex gap-4 items-center">
        <!-- JS will populate this -->
      </div>
    </nav>

    <!-- MAIN DASHBOARD -->
    <div class="px-10 py-10 max-w-7xl mx-auto">
      
      <!-- STATS -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
          <p class="text-gray-400 text-sm font-medium">Total Events</p>
          <h4 id="statEvents" class="text-3xl font-bold text-indigo-600">0</h4>
        </div>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
          <p class="text-gray-400 text-sm font-medium">Total Bookings</p>
          <h4 id="statBookings" class="text-3xl font-bold text-purple-600">0</h4>
        </div>
      </div>

      <!-- TABS -->
      <div class="flex gap-4 mb-8 border-b pb-4">
        <button onclick="switchTab('events')" id="tabEventsBtn" class="px-6 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white transition">Events Management</button>
        <button onclick="switchTab('bookings')" id="tabBookingsBtn" class="px-6 py-2 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition">Recent Bookings</button>
      </div>

      <!-- EVENTS TAB -->
      <div id="tabEvents" class="space-y-6">
        <div class="flex justify-between items-center bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
          <div>
            <h3 class="text-xl font-bold text-gray-800">Manage Events</h3>
            <p class="text-gray-400 text-sm">Add, edit, or delete events from the platform.</p>
          </div>
          <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold transition shadow-lg shadow-indigo-100">
            + Create New Event
          </button>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
          <table class="w-full text-left">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase">Title</th>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase">Category</th>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase">Date</th>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase">Seats</th>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="eventsTableBody" class="divide-y">
              <!-- JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- BOOKINGS TAB -->
      <div id="tabBookings" class="hidden space-y-6">
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
          <h3 class="text-xl font-bold text-gray-800">All Bookings</h3>
          <p class="text-gray-400 text-sm">Real-time view of all ticket bookings across all events.</p>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
          <table class="w-full text-left">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase">User</th>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase">Event</th>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase">Tickets</th>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase">Amount</th>
                <th class="px-8 py-4 text-xs font-bold text-gray-400 uppercase">Status</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody" class="divide-y">
              <!-- JS -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- MODAL -->
    <div id="eventModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[100] p-4">
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
        <div class="bg-indigo-600 p-8 text-white flex justify-between items-center">
          <h3 id="modalTitle" class="text-2xl font-bold">Create New Event</h3>
          <button onclick="closeModal()" class="text-white/60 hover:text-white text-3xl">&times;</button>
        </div>
        <form id="eventForm" class="p-8 space-y-4 grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-gray-600 text-xs font-bold mb-1.5 uppercase">Event Title</label>
            <input type="text" id="eventTitle" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition" placeholder="e.g. AI Innovation Summit">
          </div>
          <div class="md:col-span-2">
            <div class="flex justify-between items-end mb-1.5">
              <label class="block text-gray-600 text-xs font-bold uppercase">Description</label>
              <button type="button" onclick="generateDescriptionAI()" class="text-xs bg-indigo-50 text-indigo-600 font-bold px-2 py-1 rounded hover:bg-indigo-100 transition">✨ Generate with AI</button>
            </div>
            <textarea id="eventDescription" rows="3" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition" placeholder="Tell people about the event..."></textarea>
          </div>
          <div>
            <label class="block text-gray-600 text-xs font-bold mb-1.5 uppercase">Category</label>
            <select id="eventCategory" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition">
              <option value="Technical">Technical</option>
              <option value="Cultural">Cultural</option>
              <option value="Sports">Sports</option>
              <option value="Workshop">Workshop</option>
              <option value="Seminar">Seminar</option>
              <option value="Music">Music</option>
              <option value="Business">Business</option>
              <option value="Health">Health</option>
              <option value="Food">Food</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-600 text-xs font-bold mb-1.5 uppercase">Date</label>
            <input type="date" id="eventDate" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition">
          </div>
          <div>
            <label class="block text-gray-600 text-xs font-bold mb-1.5 uppercase">Location</label>
            <input type="text" id="eventLocation" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition" placeholder="e.g. Mumbai, Maharashtra">
          </div>
          <div>
            <label class="block text-gray-600 text-xs font-bold mb-1.5 uppercase">Price (₹)</label>
            <input type="number" id="eventPrice" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition" placeholder="0 for free">
          </div>
          <div>
            <label class="block text-gray-600 text-xs font-bold mb-1.5 uppercase">Total Seats</label>
            <input type="number" id="eventSeats" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition" placeholder="Max capacity">
          </div>
          <div class="md:col-span-2">
            <label class="block text-gray-600 text-xs font-bold mb-1.5 uppercase">Image URL (Optional)</label>
            <input type="text" id="eventImage" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-indigo-500 outline-none transition" placeholder="https://images.unsplash.com/photo-...">
          </div>
          <div class="md:col-span-2 pt-4 flex gap-4">
             <button type="submit" id="saveBtn" class="flex-grow bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition">Save Event</button>
             <button type="button" onclick="closeModal()" class="flex-grow bg-gray-100 text-gray-500 font-bold py-4 rounded-xl hover:bg-gray-200 transition">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("user"));
      let isEditMode = false;
      let editEventId = null;

      window.onload = () => {
        if (!user || user.role !== "admin") {
          window.location.href = "/login.html";
          return;
        }
        updateNavbar();
        fetchData();
      };

      function updateNavbar() {
        const navLinks = document.getElementById("navLinks");
        navLinks.innerHTML = `
          <a href="/index.html" class="text-gray-600 hover:text-indigo-600 font-medium">Home</a>
          <a href="/events.html" class="text-gray-600 hover:text-indigo-600 font-medium">Events</a>
          <a href="/admin-dashboard.html" class="text-indigo-600 font-bold">Dashboard</a>
          <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-1.5 rounded-lg text-white font-medium ml-2">Logout</button>
        `;
      }

      async function fetchData() {
        await fetchEvents();
        await fetchBookings();
      }

      async function fetchEvents() {
        try {
          const response = await fetch("http://localhost:5000/api/events/all");
          const data = await response.json();
          document.getElementById("statEvents").textContent = data.events ? data.events.length : 0;
          renderEventsTable(data.events || []);
        } catch (e) { console.error(e); }
      }

      async function fetchBookings() {
        try {
          const response = await fetch("http://localhost:5000/api/bookings/allbookings");
          const data = await response.json();
          document.getElementById("statBookings").textContent = data.bookings ? data.bookings.length : 0;
          renderBookingsTable(data.bookings || []);
        } catch (e) { console.error(e); }
      }

      function renderEventsTable(events) {
        const body = document.getElementById("eventsTableBody");
        body.innerHTML = "";
        events.forEach(e => {
          body.innerHTML += `
            <tr class="hover:bg-gray-50 transition">
              <td class="px-8 py-5 font-semibold text-gray-800">${e.title}</td>
              <td class="px-8 py-5 text-gray-500 font-medium">${e.category}</td>
              <td class="px-8 py-5 text-gray-500 font-medium">${e.date}</td>
              <td class="px-8 py-5">
                <span class="text-indigo-600 font-bold">${e.availableSeats}</span>
                <span class="text-gray-300 font-medium">/ ${e.totalSeats}</span>
              </td>
              <td class="px-8 py-5 text-right flex justify-end gap-3">
                <button onclick="editEvent('${e._id}')" class="text-gray-400 hover:text-indigo-600 text-xl" title="Edit">✏️</button>
                <button onclick="deleteEvent('${e._id}')" class="text-gray-400 hover:text-red-500 text-xl" title="Delete">🗑️</button>
              </td>
            </tr>
          `;
        });
      }

      function renderBookingsTable(bookings) {
        const body = document.getElementById("bookingsTableBody");
        body.innerHTML = "";
        bookings.forEach(b => {
          body.innerHTML += `
            <tr class="hover:bg-gray-50 transition">
              <td class="px-8 py-5">
                <p class="font-bold text-gray-800">${b.userId ? b.userId.name : 'Unknown User'}</p>
                <p class="text-xs text-gray-400">${b.userId ? b.userId.email : ''}</p>
              </td>
              <td class="px-8 py-5 font-medium text-gray-600">${b.eventId ? b.eventId.title : 'Deleted Event'}</td>
              <td class="px-8 py-5 font-bold text-gray-800">${b.ticketsBooked}</td>
              <td class="px-8 py-5 font-bold text-indigo-600">₹${b.totalPrice}</td>
              <td class="px-8 py-5">
                <span class="${b.status === 'confirmed' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'} text-[10px] font-bold px-2 py-0.5 rounded uppercase">
                  ${b.status}
                </span>
              </td>
            </tr>
          `;
        });
      }

      function switchTab(tab) {
        document.getElementById("tabEvents").classList.add("hidden");
        document.getElementById("tabBookings").classList.add("hidden");
        document.getElementById("tabEventsBtn").className = "px-6 py-2 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition";
        document.getElementById("tabBookingsBtn").className = "px-6 py-2 rounded-xl text-sm font-bold text-gray-500 hover:bg-gray-100 transition";
        
        if (tab === 'events') {
          document.getElementById("tabEvents").classList.remove("hidden");
          document.getElementById("tabEventsBtn").className = "px-6 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white transition";
        } else {
          document.getElementById("tabBookings").classList.remove("hidden");
          document.getElementById("tabBookingsBtn").className = "px-6 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white transition";
        }
      }

      function openModal() {
        isEditMode = false;
        editEventId = null;
        document.getElementById("modalTitle").textContent = "Create New Event";
        document.getElementById("eventForm").reset();
        document.getElementById("eventModal").classList.remove("hidden");
        document.getElementById("eventModal").classList.add("flex");
      }

      function closeModal() {
        document.getElementById("eventModal").classList.add("hidden");
        document.getElementById("eventModal").classList.remove("flex");
      }

      document.getElementById("eventForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const eventData = {
          title: document.getElementById("eventTitle").value,
          description: document.getElementById("eventDescription").value,
          category: document.getElementById("eventCategory").value,
          date: document.getElementById("eventDate").value,
          location: document.getElementById("eventLocation").value,
          price: parseInt(document.getElementById("eventPrice").value),
          totalSeats: parseInt(document.getElementById("eventSeats").value),
          image: document.getElementById("eventImage").value || undefined
        };

        const url = isEditMode 
          ? `http://localhost:5000/api/events/update/${editEventId}`
          : "http://localhost:5000/api/events/create";
        const method = isEditMode ? "PUT" : "POST";

        try {
          const res = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(eventData)
          });
          if (res.ok) {
            closeModal();
            fetchEvents();
            alert("Event saved successfully!");
          } else {
            const err = await res.json();
            alert("Error: " + err.message);
          }
        } catch (err) { alert("Server error"); }
      });

      async function deleteEvent(id) {
        if (!confirm("Are you sure?")) return;
        try {
          const res = await fetch(`http://localhost:5000/api/events/delete/${id}`, { method: "DELETE" });
          if (res.ok) { fetchEvents(); alert("Event deleted!"); }
        } catch (e) { alert("Delete failed"); }
      }

      async function editEvent(id) {
        isEditMode = true;
        editEventId = id;
        try {
          const res = await fetch(`http://localhost:5000/api/events/${id}`);
          const data = await res.json();
          const e = data.event;
          
          document.getElementById("modalTitle").textContent = "Edit Event";
          document.getElementById("eventTitle").value = e.title;
          document.getElementById("eventDescription").value = e.description;
          document.getElementById("eventCategory").value = e.category;
          document.getElementById("eventDate").value = e.date;
          document.getElementById("eventLocation").value = e.location;
          document.getElementById("eventPrice").value = e.price;
          document.getElementById("eventSeats").value = e.totalSeats;
          document.getElementById("eventImage").value = e.image || "";
          
          document.getElementById("eventModal").classList.remove("hidden");
          document.getElementById("eventModal").classList.add("flex");
        } catch (e) { alert("Load failed"); }
      }

      async function generateDescriptionAI() {
        const title = document.getElementById("eventTitle").value;
        const category = document.getElementById("eventCategory").value;

        if (!title) {
          alert("Please enter an Event Title first!");
          return;
        }

        const descField = document.getElementById("eventDescription");
        descField.value = "Generating description... ✨";
        descField.disabled = true;

        try {
          const res = await fetch("http://localhost:5000/api/ai/generate-desc", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, category })
          });
          
          const data = await res.json();
          descField.value = data.description;
        } catch (error) {
          alert("AI Generation failed.");
          descField.value = "";
        } finally {
          descField.disabled = false;
        }
      }

      function logout() {
        localStorage.removeItem("user");
        window.location.href = "/login.html";
      }
    </script>
  </body>
</html>
