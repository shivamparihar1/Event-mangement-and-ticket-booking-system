<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=/login.html" />
  <title>Register | EventSphere</title>
</head>
<body>
  <script>
    // Switch to register tab after arriving at the login page
    localStorage.setItem('openTab', 'register');
    window.location.href = '/login.html';
  </script>
</body>
</html>

  <body class="min-h-screen flex items-center justify-center bg-[#f4f4f4]">

    <div class="w-full max-w-md mx-4">

      <!-- CARD -->
      <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- TOP BANNER -->
        <div class="bg-gray-900 px-8 py-8 text-center">
          <h1 class="text-3xl font-bold text-white">🎟️ EventSphere</h1>
          <p class="text-gray-400 mt-2 text-sm">Join thousands of event lovers today</p>
        </div>

        <!-- FORM -->
        <div class="px-8 py-8">
          <h2 class="text-2xl font-bold text-gray-800 mb-1">Create Account</h2>
          <p class="text-gray-400 text-sm mb-6">Fill in your details to get started</p>

          <form id="registerForm" class="space-y-5">

            <!-- NAME -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Full Name</label>
              <div class="flex items-center border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-gray-900 transition">
                <span class="text-gray-400 mr-3">👤</span>
                <input
                  type="text"
                  id="name"
                  placeholder="Enter your full name"
                  class="w-full text-gray-800 text-sm outline-none bg-transparent"
                />
              </div>
            </div>

            <!-- EMAIL -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Email Address</label>
              <div class="flex items-center border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-gray-900 transition">
                <span class="text-gray-400 mr-3">📧</span>
                <input
                  type="email"
                  id="email"
                  placeholder="Enter your email"
                  class="w-full text-gray-800 text-sm outline-none bg-transparent"
                />
              </div>
            </div>

            <!-- PASSWORD -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Password</label>
              <div class="flex items-center border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-gray-900 transition">
                <span class="text-gray-400 mr-3">🔒</span>
                <input
                  type="password"
                  id="password"
                  placeholder="Min. 6 characters"
                  class="w-full text-gray-800 text-sm outline-none bg-transparent"
                />
              </div>
            </div>

            <!-- ROLE -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Register As</label>
              <div class="flex gap-3">
                <label class="flex-1 flex items-center gap-3 border-2 border-gray-200 rounded-xl px-4 py-3 cursor-pointer hover:border-gray-400 transition has-[:checked]:border-gray-900 has-[:checked]:bg-gray-100">
                  <input type="radio" name="role" value="user" class="accent-gray-900" checked />
                  <span class="text-gray-700 text-sm font-medium">👤 User</span>
                </label>
                <label class="flex-1 flex items-center gap-3 border-2 border-gray-200 rounded-xl px-4 py-3 cursor-pointer hover:border-gray-400 transition has-[:checked]:border-gray-900 has-[:checked]:bg-gray-100">
                  <input type="radio" name="role" value="admin" class="accent-gray-900" />
                  <span class="text-gray-700 text-sm font-medium">🛠️ Admin</span>
                </label>
              </div>
            </div>

            <!-- ERROR -->
            <p id="errorMsg" class="text-red-500 text-sm bg-red-50 px-4 py-2 rounded-lg hidden"></p>

            <!-- SUCCESS -->
            <p id="successMsg" class="text-green-600 text-sm bg-green-50 px-4 py-2 rounded-lg hidden"></p>

            <!-- BUTTON -->
            <button
              type="submit"
              id="submitBtn"
              class="w-full bg-gray-900 hover:bg-black text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-gray-200 text-sm"
            >
              Create Account →
            </button>

          </form>

          <!-- LOGIN LINK -->
          <p class="text-center text-gray-400 text-sm mt-6">
            Already have an account?
            <a href="/login.html" class="text-gray-900 font-semibold hover:underline">Login here</a>
          </p>

        </div>
      </div>

    </div>

    <script>
      const form = document.getElementById("registerForm");
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const role = document.querySelector('input[name="role"]:checked').value;

        errorMsg.classList.add("hidden");
        successMsg.classList.add("hidden");

        if (!name || !email || !password) {
          errorMsg.textContent = "Please fill in all fields.";
          errorMsg.classList.remove("hidden");
          return;
        }

        submitBtn.textContent = "Creating account...";
        submitBtn.disabled = true;

        try {
          const response = await fetch("https://event-mangement-and-ticket-booking.onrender.com/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password, role }),
          });

          const data = await response.json();

          if (!response.ok) {
            errorMsg.textContent = data.message;
            errorMsg.classList.remove("hidden");
            submitBtn.textContent = "Create Account →";
            submitBtn.disabled = false;
            return;
          }

          successMsg.textContent = "Account created! Redirecting to login...";
          successMsg.classList.remove("hidden");

          setTimeout(() => {
            window.location.href = "/login.html";
          }, 2000);

        } catch (error) {
          errorMsg.textContent = "Server not reachable. Please try again.";
          errorMsg.classList.remove("hidden");
          submitBtn.textContent = "Create Account →";
          submitBtn.disabled = false;
        }
      });
    </script>

  </body>
</html>
