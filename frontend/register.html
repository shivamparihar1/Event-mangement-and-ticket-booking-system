<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | EventSphere</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100">

    <div class="w-full max-w-md mx-4">

      <!-- CARD -->
      <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- TOP BANNER -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-8 py-8 text-center">
          <h1 class="text-3xl font-extrabold">🎟️ <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-pink-200">EventSphere</span></h1>
          <p class="text-indigo-200 mt-2 text-sm">Join thousands of event lovers today</p>
        </div>

        <!-- FORM -->
        <div class="px-8 py-8">
          <h2 class="text-2xl font-bold text-gray-800 mb-1">Create Account</h2>
          <p class="text-gray-400 text-sm mb-6">Fill in your details to get started</p>

          <form id="registerForm" class="space-y-5">

            <!-- NAME -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Full Name</label>
              <div class="flex items-center border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-indigo-500 transition">
                <span class="text-gray-400 mr-3">👤</span>
                <input
                  type="text"
                  id="name"
                  placeholder="Enter your full name"
                  class="w-full text-gray-800 text-sm outline-none bg-transparent"
                />
              </div>
            </div>

            <!-- EMAIL -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Email Address</label>
              <div class="flex items-center border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-indigo-500 transition">
                <span class="text-gray-400 mr-3">📧</span>
                <input
                  type="email"
                  id="email"
                  placeholder="Enter your email"
                  class="w-full text-gray-800 text-sm outline-none bg-transparent"
                />
              </div>
            </div>

            <!-- PASSWORD -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Password</label>
              <div class="flex items-center border-2 border-gray-200 rounded-xl px-4 py-3 focus-within:border-indigo-500 transition">
                <span class="text-gray-400 mr-3">🔒</span>
                <input
                  type="password"
                  id="password"
                  placeholder="Min. 6 characters"
                  class="w-full text-gray-800 text-sm outline-none bg-transparent"
                />
              </div>
            </div>

            <!-- ROLE -->
            <div>
              <label class="block text-gray-600 text-sm font-semibold mb-1.5">Register As</label>
              <div class="flex gap-3">
                <label class="flex-1 flex items-center gap-3 border-2 border-gray-200 rounded-xl px-4 py-3 cursor-pointer hover:border-indigo-400 transition has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
                  <input type="radio" name="role" value="user" class="accent-indigo-600" checked />
                  <span class="text-gray-700 text-sm font-medium">👤 User</span>
                </label>
                <label class="flex-1 flex items-center gap-3 border-2 border-gray-200 rounded-xl px-4 py-3 cursor-pointer hover:border-indigo-400 transition has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
                  <input type="radio" name="role" value="admin" class="accent-indigo-600" />
                  <span class="text-gray-700 text-sm font-medium">🛠️ Admin</span>
                </label>
              </div>
            </div>

            <!-- ERROR -->
            <p id="errorMsg" class="text-red-500 text-sm bg-red-50 px-4 py-2 rounded-lg hidden"></p>

            <!-- SUCCESS -->
            <p id="successMsg" class="text-green-600 text-sm bg-green-50 px-4 py-2 rounded-lg hidden"></p>

            <!-- BUTTON -->
            <button
              type="submit"
              id="submitBtn"
              class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-indigo-200 text-sm"
            >
              Create Account →
            </button>

          </form>

          <!-- LOGIN LINK -->
          <p class="text-center text-gray-400 text-sm mt-6">
            Already have an account?
            <a href="/login.html" class="text-indigo-600 font-semibold hover:underline">Login here</a>
          </p>

        </div>
      </div>

    </div>

    <script>
      const form = document.getElementById("registerForm");
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const role = document.querySelector('input[name="role"]:checked').value;

        errorMsg.classList.add("hidden");
        successMsg.classList.add("hidden");

        if (!name || !email || !password) {
          errorMsg.textContent = "Please fill in all fields.";
          errorMsg.classList.remove("hidden");
          return;
        }

        submitBtn.textContent = "Creating account...";
        submitBtn.disabled = true;

        try {
          const response = await fetch("http://localhost:5000/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password, role }),
          });

          const data = await response.json();

          if (!response.ok) {
            errorMsg.textContent = data.message;
            errorMsg.classList.remove("hidden");
            submitBtn.textContent = "Create Account →";
            submitBtn.disabled = false;
            return;
          }

          successMsg.textContent = "Account created! Redirecting to login...";
          successMsg.classList.remove("hidden");

          setTimeout(() => {
            window.location.href = "/login.html";
          }, 2000);

        } catch (error) {
          errorMsg.textContent = "Server not reachable. Please try again.";
          errorMsg.classList.remove("hidden");
          submitBtn.textContent = "Create Account →";
          submitBtn.disabled = false;
        }
      });
    </script>

  </body>
</html>
